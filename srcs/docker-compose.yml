services:
  nginx:
    build:
      context: requirements/nginx
      args:
        - DOMAIN_NAME=${DOMAIN_NAME}
        - PORT=${PORT}
    image: my_nginx
    pull_policy: build
    container_name: nginx
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_net
    depends_on:

      - wordpress
      - adminer
      - homer
    restart: on-failure

  wordpress:
    build: requirements/Wordpress
    image: my_wordpress
    pull_policy: build
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_admin_user
      - wp_normal_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_net
    depends_on:

      mariadb:
        condition: service_healthy
    restart: on-failure

  mariadb:
    build: requirements/mariadb
    image: my_mariadb
    pull_policy: build
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_net
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    secrets:
      - db_password
      - db_root_password

  webserv:
    build: requirements/bonus/webserv
    image: my_webserv
    pull_policy: build
    container_name: webserv
    ports:
      - "8080:8080"
    networks:
      - webserv_net
    restart: on-failure

  redis:
    build: requirements/bonus/redis
    image: my_redis
    pull_policy: build
    container_name: redis
    networks:
      - inception_net
    restart: on-failure


  homer:
    build:
      context: requirements/bonus/homer
      dockerfile: Dockerfile
    image: my_homer
    pull_policy: build
    container_name: homer
    volumes:
      - ./requirements/bonus/homer/conf/config.yml:/var/www/homer/assets/config.yml:ro
    networks:
      - inception_net
    restart: unless-stopped

  adminer:
    build: requirements/bonus/adminer
    image: my_adminer
    pull_policy: build
    container_name: adminer
    networks:
      - inception_net
    depends_on:

      - mariadb
    restart: on-failure

  ftp:
    build: requirements/bonus/ftp
    image: my_ftp
    pull_policy: build
    container_name: ftp
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_net
    env_file:
      - .env
    secrets:
      - ftp_password
    restart: on-failure

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_user:
    file: ../secrets/wp_admin_user.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_normal_password:
    file: ../secrets/wp_normal_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

networks:
  inception_net:
  webserv_net:
