services:
  nginx:
    build:
      context: requirements/nginx
      args:
        - DOMAIN_NAME=${DOMAIN_NAME}
    image: my_nginx
    pull_policy: build
    container_name: nginx
    ports:
      - "8443:443"
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_net
    depends_on:
      - wordpress
    restart: on-failure

  wordpress:
    build: requirements/Wordpress
    image: my_wordpress
    pull_policy: build
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_admin_user
      - wp_normal_password
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_net
    depends_on:
      mariadb:
        condition: service_healthy
    restart: on-failure

  mariadb:
    build: requirements/mariadb
    image: my_mariadb
    pull_policy: build
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_net
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/db_root_password)" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    secrets:
      - db_password
      - db_root_password

  webserv:
    build: requirements/bonus/webserv
    image: my_webserv
    pull_policy: build
    container_name: webserv
    ports:
      - "8080:8080"
    networks:
      - webserv_net

  redis:
    build: requirements/bonus/redis
    image: my_redis
    pull_policy: build
    container_name: redis
    networks:
      - inception_net

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_user:
    file: ../secrets/wp_admin_user.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_normal_password:
    file: ../secrets/wp_normal_password.txt

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

networks:
  inception_net:
  webserv_net:
