# Run in standalone mode
listen=YES
listen_ipv6=NO

# Disable anonymous, enable local users
anonymous_enable=NO
local_enable=YES
write_enable=YES

# Passive mode — critical for Docker
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
# This must match your VM's IP or domain
pasv_address=${FTP_HOST}

# Chroot the user to their home directory
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html

# FTPS (TLS)
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ssl/private/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Logging
xferlog_enable=YES